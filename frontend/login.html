<!DOCTYPE html>
<html lang="en" data-theme="black">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0b">
  <title>Sign in — XE3AGLE</title>
  <link rel="stylesheet" href="/css/app.css">
  <script src="/config.js"></script>
</head>
<body>
  <div class="landing">
    <div class="landing-logo">XE3AGLE</div>
    <div class="landing-tag" id="form-title">Sign in</div>

    <form id="auth-form" class="landing-actions" style="text-align:left">
      <div class="field" id="username-field" style="display:none">
        <label>Username</label>
        <input type="text" id="username" autocomplete="username" placeholder="trader_joe" minlength="3" maxlength="32">
      </div>
      <div class="field">
        <label id="login-label">Email or username</label>
        <input type="text" id="login" autocomplete="username" required>
      </div>
      <div class="field" id="email-field" style="display:none">
        <label>Email</label>
        <input type="email" id="email" autocomplete="email">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" autocomplete="current-password" required minlength="8">
      </div>
      <button type="submit" class="btn btn-primary" id="submit-btn">Sign in</button>
      <p id="error" class="text-danger" style="display:none;font-size:0.9rem"></p>
    </form>

    <div style="margin-top:24px">
      <button class="btn btn-ghost btn-sm" id="toggle-mode">Need an account? Sign up</button>
      <br>
      <a href="/reset.html" class="dim" style="font-size:0.85rem;margin-top:12px;display:inline-block">Forgot password?</a>
    </div>
  </div>

  <script type="module">
    import { api } from './js/services/api.js';
    import { setAuth } from './js/domain/state.js';

    const params = new URLSearchParams(location.search);
    let mode = params.get('mode') === 'signup' ? 'signup' : 'login';

    const form = document.getElementById('auth-form');
    const title = document.getElementById('form-title');
    const submitBtn = document.getElementById('submit-btn');
    const toggleBtn = document.getElementById('toggle-mode');
    const errorEl = document.getElementById('error');
    const usernameField = document.getElementById('username-field');
    const emailField = document.getElementById('email-field');
    const loginLabel = document.getElementById('login-label');

    function applyMode() {
      if (mode === 'signup') {
        title.textContent = 'Create account';
        submitBtn.textContent = 'Create free account';
        toggleBtn.textContent = 'Already have an account? Sign in';
        usernameField.style.display = 'block';
        emailField.style.display = 'block';
        loginLabel.textContent = 'Username (login field unused)';
        document.getElementById('login').required = false;
        document.getElementById('login').closest('.field').style.display = 'none';
      } else {
        title.textContent = 'Sign in';
        submitBtn.textContent = 'Sign in';
        toggleBtn.textContent = 'Need an account? Sign up';
        usernameField.style.display = 'none';
        emailField.style.display = 'none';
        document.getElementById('login').closest('.field').style.display = 'block';
        document.getElementById('login').required = true;
        loginLabel.textContent = 'Email or username';
      }
      errorEl.style.display = 'none';
    }

    toggleBtn.addEventListener('click', () => {
      mode = mode === 'login' ? 'signup' : 'login';
      applyMode();
    });
    applyMode();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.style.display = 'none';
      submitBtn.disabled = true;
      try {
        let res;
        if (mode === 'signup') {
          res = await api.signup({
            username: document.getElementById('username').value.trim(),
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
          });
        } else {
          res = await api.login({
            login: document.getElementById('login').value.trim(),
            password: document.getElementById('password').value,
          });
        }
        setAuth({ token: res.token, user: res.user });
        location.href = '/app.html';
      } catch (err) {
        errorEl.textContent = (err instanceof TypeError || /fetch/i.test(err.message || ''))
          ? 'Cannot reach the XE3AGLE API. Check that the backend is deployed, DATABASE_URL is configured, and config.js points to the API URL.'
          : (err.message || 'Request failed');
        errorEl.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
